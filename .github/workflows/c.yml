name: C

on:
  push:
    branches: [ main,cicd ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: install dependencies
      run: sudo apt install libx11-dev
    - name: make clean
      run: CONF=unix make clean
    - name: make
      run: CONF=unix make
